# Cloudflare configuration for real-estate-template-base44
# https://developers.cloudflare.com/pages/
#
# For `wrangler pages deploy` CLI: this config uses pages_build_output_dir
# and the functions/_middleware.js (Pages Function) for SPA routing.
# The [assets] section is not supported by the Pages CLI deploy.

name = "real-estate-template-base44"
compatibility_date = "2026-08-09"

# Deploy static assets from the Vite build output directory
pages_build_output_dir = "dist"

# Environment variables are set in the Cloudflare Pages dashboard:
#   Settings → Environment Variables → Production
# Required for the app to function:
#   VITE_SUPABASE_URL         = your-supabase-project-url
#   VITE_SUPABASE_ANON_KEY    = your-supabase-anon-key
#   VITE_BASE44_URL           = your-supabase-project-url (base44 compat)
#   VITE_BASE44_ANON_KEY      = your-supabase-anon-key (base44 compat)
[vars]
  APP_NAME = "Real Estate Template"
