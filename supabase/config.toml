# For more information, see https://supabase.com/docs/guides/local-development
# THIS FILE IS AUTOGENERATED, DO NOT MODIFY
# To generate the supabase/config.toml file locally, run `supabase init`
# Official docs: https://supabase.com/docs/guides/local-development/cli
project_id = "real-estate-template-base44"

[api]
enabled = true
# Port to use for the API + GoTrue. Example: 54321
port = 54321
# Port to use for the analytics engine. Example: 54322
# analytics_port = 54322
# The API key (anon key) to use to authorize API calls.
# This is used to pass the Supabase client library.
# A default `anon` key is generated if unspecified.
# anon_key = "..."
# The secret key used to bypass Row Level Security when making requests to the Supabase API.
# This is used for backend operations with full access.
# service_role_key = "..."
# Use the realtime pub/sub feature.
# This is used to enable/disable the realtime server.
# realtime.enabled = true

[auth]
enabled = true
# Port to use for the GoTrue server.
# port = 9999
# The endpoint to use for the GoTrue server.
# endpoint = "http://localhost:9999"
# The secret key used to sign and verify the JWT tokens.
# secret = "..."
# The URL to use for the GoTrue server.
# url = "http://localhost:9999"
# The redirect URLs to use for the GoTrue server.
# redirect_urls = []
# The signup method to use for the GoTrue server.
# signup_enabled = true
# The confirmation URL to use for the GoTrue server.
# confirm_url = "http://localhost:5173/confirm"
# The invite URL to use for the GoTrue server.
# invite_url = "http://localhost:5173/invite"
# The magic link URL to use for the GoTrue server.
# magic_link_url = "http://localhost:5173/magic-link"
# The recovery URL to use for the GoTrue server.
# recovery_url = "http://localhost:5173/recovery"
# The reauthentication URL to use for the GoTrue server.
# reauth_url = "http://localhost:5173/reauth"
# The email sign-in URL to use for the GoTrue server.
# email_signin_url = "http://localhost:5173/email-sign-in"
# The email sign-up URL to use for the GoTrue server.
# email_signup_url = "http://localhost:5173/sign-up"
# The OAuth URLs to use for the GoTrue server.
# oauth_urls = {}
# The rate limit to use for the GoTrue server.
# rate_limit = 100
# The max request body size to use for the GoTrue server.
# max_request_body_size = 3774877
# The max parameters to use for the GoTrue server.
# max_parameters = 20

[db]
enabled = true
# Port to use for the Postgres server. Example: 5432
port = 5432
# Port to use for the realtime server. Example: 54325
realtime_port = 54325
# Port to use for the pooler server. Example: 54324
pooler_port = 54324
# The database password to use.
# password = "..."
# Path to the Postgres server certificate directory.
# ssl_cert_dir = "/path/to/certs"
# The connection string to use for the Postgres server.
# connection_string = "postgresql://postgres:password@localhost:5432/postgres"

[db.templ]
# Use globally available objects for template connections.
# enabled = true
# [db.templ.version]
# image = public.ecr.aws/supabase/postgres:15.8.1.031-bf92747c34"
# [db.templ.migration]
# schema = "public"

[db.pooler]
enabled = false
# Port to use for the pooler server. Example: 54324
port = 54324
# The pool_mode to use for the pooler server.
# pool_mode = "transaction"
# The default_pool_size to use for the pooler server.
# default_pool_size = 20
# The max_client_conn to use for the pooler server.
# max_client_conn = 100

[db.replication]
enabled = false
# The schema to use for the Supabase Realtime server.
# schema = "public"
# The role to use for the Supabase Realtime server.
# role = "realtime"
# The password to use for the Supabase Realtime server.
# password = "..."

[functions]
# Whether to enable the Edge Functions feature.
# enabled = true
# The URL to use for the Edge Functions server.
# url = "http://localhost:54322/functions/v1"
# The directory to use for the Edge Functions server.
# main_dir = "supabase/functions"
# The port to use for the Edge Functions server.
# port = 54322

[functions.supabase_admin]
enabled = true
verify_jwt = true

[studio]
enabled = true
# Port to use for the Studio server. Example: 54323
port = 54323
# Port to use for the Studio server (websockets). Example: 54323
# websocket_port = 54323
# The URL to use for the Studio server.
# url = "http://localhost:54323"

# [studio.auth]
# enabled = true
# port = 54324
# url = "http://localhost:54324"

# [studio.functions]
# enabled = true
# port = 54325
# url = "http://localhost:54325"

# [studio.database]
# enabled = true
# port = 54326
# url = "http://localhost:54326"

[storage]
enabled = true
# The URL to use for the Storage server.
# url = "http://localhost:5173/storage/v1"
# The port to use for the Storage server.
# port = 5173
# The file size limit to use for the Storage server.
# file_size_limit = 52428800

[local_database_seed]
# Scripts to run when initializing the local database.
# enabled = true
# sql_files = ['./seed.sql']
# [local_database_seed.sql_files]
# path = "./sql_files"

[edge_runtime]
# Configure one of the below for local development.
# [edge_runtime.]
# enabled = true
# ip = "0.0.0.0"
# port = 54323
# [edge_runtime.tns]
# enabled = true

[analytics]
enabled = false
port = 54324
vector_port = 54325
# _enterprise = false
# branch = ""
# destination = ""
# public_endpoint = ""
# request_segment = ""
# api_key = ""

[branches]
# Prevents the creation of edge runtime services when set to true.
# enabled = true

[ignore_hooks]
# Prevents the creation of edge runtime hooks when set to true.
# enabled = true

[functions.migrate_and_seed]
enabled = false
verify_jwt = true
